<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .image {
        animation-name: spinny;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
      }
      @keyframes spinny {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(90deg);
        }
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site is in maintance mode!</title>
  </head>
  <body>
    <img src="https://i.imgur.com/GaOPAIA.png" width="250" title="Site is in maintance mode" class="image">
  </body>
</html>
