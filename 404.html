<!DOCTYPE html>
<html>
  <head>
    <style>
     * {
       font-family: Monospace;
       text-align: center;
       color: white;
     }
     body {
       background-color: #001d2a;
     }
     h1 {
       font-size: 80px;
     }
     p {
       font-size: 15px;
     }
     button {
       background-color: #085562;
       border: 3px solid #085562;
       border-radius: 5px;
     }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <h1>404</h1>
    <p>Page not found</p>
    <button onclick="redirect('index.html')">Go back</button>
    <script>
    function redirect(url) {
      window.location.replace(url);
    }
    </script>
  </body>
</html>
